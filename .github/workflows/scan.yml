name: memescan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"       # 11:00 AM IST: start the day after quiet hours
    - cron: "17 6-19 * * *"    # backup restart if the chain ever breaks (awake hours only)

concurrency:
  group: memescan
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  hours:
    # quiet hours: no scans from 2 AM to 11 AM IST (see quiet.py)
    runs-on: ubuntu-latest
    outputs:
      quiet: ${{ steps.check.outputs.quiet }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if python3 quiet.py; then echo "quiet=yes" >> "$GITHUB_OUTPUT"; echo "Quiet hours: no scan."; else echo "quiet=no" >> "$GITHUB_OUTPUT"; fi

  scan:
    needs: hours
    if: needs.hours.outputs.quiet == 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved state (stories, holders, sent pings, history)
        uses: actions/cache/restore@v4
        with:
          path: |
            new_state.json
            stories.json
            scan_cache.json
            tg_sent.json
            new_history.jsonl
          key: memescan-state-${{ github.run_id }}
          restore-keys: memescan-state-

      - name: Install Claude Code (for coin stories)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            curl -fsSL https://claude.ai/install.sh | bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            # tiny login check, once per job (~every 5.5 h)
            cd "$RUNNER_TEMP" && "$HOME/.local/bin/claude" -p "Reply with the word OK" --model haiku               --setting-sources project --strict-mcp-config --tools "" --no-session-persistence               | head -c 200 && echo " <- Claude login check" || echo "Claude login check FAILED"
          else
            echo "No Claude token secret: stories are off."
          fi

      - name: Scan every 10 minutes
        id: loop
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LOOP_MINUTES: ${{ vars.LOOP_MINUTES || '330' }}
        run: bash loop.sh

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            new_state.json
            stories.json
            scan_cache.json
            tg_sent.json
            new_history.jsonl
          key: memescan-state-${{ github.run_id }}

      - name: Keep the pick history for report cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ github.run_id }}
          path: |
            new_history.jsonl
            latest.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Start the next job
        # only after a normal finish, so a broken setup cannot start jobs in a loop
        if: always() && steps.loop.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 quiet.py; then echo "Quiet hours began: the 11 AM IST cron starts tomorrow's chain."; exit 0; fi
          gh workflow run scan.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
